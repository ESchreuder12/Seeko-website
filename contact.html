<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | SEEKO</title>

    <meta name="description"
        content="Contact SEEKO Taxation and Accounting Consultants">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <div class="wrap top">

            <div class="logo">
                <img src="Logo.png" alt="SEEKO Logo" class="site-logo">
            </div>

            <nav>
                <a href="index.html">Home</a>
                <a href="services.html">Services</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="mailto:info@seekotax.co.za">Email Us</a>
            </nav>

        </div>
    </header>

    <section class="hero">
        <div class="wrap">

            <h1>Contact SEEKO</h1>

            <p>
                Let's discuss your taxation, accounting and financial
                reporting requirements.
            </p>

        </div>
    </section>

    <section class="services">

        <div class="wrap">

            <h2>Get In Touch</h2>

            <p>
                Complete the form below and we will contact you shortly. 
            </p>

            <p>
                Email:
                <a href="mailto:info@seekotax.co.za">
                    info@seekotax.co.za
                </a>
            </p>

            <form class="contact-form">

                <input
                    type="text"
                    placeholder="Your Name"
                    required>

                <input
                    type="email"
                    placeholder="Email Address"
                    required>

                <select>
                    <option>Corporate Tax Advisory</option>
                    <option>Financial Reporting</option>
                    <option>SARS Compliance</option>
                    <option>Business Compliance</option>
                </select>

                <textarea
                    rows="6"
                    placeholder="Your Message">
                </textarea>

                <button type="submit" class="btn">
                    Send Enquiry
                </button>
